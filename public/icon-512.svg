<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A57" />
      <stop offset="100%" stop-color="#C85A36" />
    </linearGradient>
    <filter id="shadow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad512)" />

  <!-- Outer Ring Accent -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8" />

  <!-- Central Culinary Artwork -->
  <g filter="url(#shadow512)" transform="translate(256, 260)">
    <!-- Skillet Handle -->
    <path d="M -130 50 L -70 20 L -55 35 L -115 65 Z" fill="#FAF8F5" />
    
    <!-- Cast Iron Skillet Body -->
    <path d="M -90 0 C -90 85, 90 85, 90 0 C 90 -12, -90 -12, -90 0 Z" fill="#FAF8F5" />
    <ellipse cx="0" cy="0" rx="80" ry="20" fill="#E07A57" opacity="0.35" />

    <!-- Cooking Flame / Sizzle -->
    <path d="M -22 -35 C -40 -70, -12 -105, -6 -130 C 12 -105, 30 -125, 24 -90 C 40 -70, 12 -35, -22 -35 Z" fill="#FFF2DF" />
    <path d="M -10 -45 C -22 -70, -6 -85, -2 -102 C 10 -85, 18 -98, 14 -75 C 22 -58, 6 -40, -10 -45 Z" fill="#F4A261" />

    <!-- Crossed Chef Knives -->
    <path d="M 12 -120 C 30 -160, 70 -190, 95 -200 C 90 -165, 55 -135, 28 -125 Z" fill="#FAF8F5" />
    <path d="M -12 -120 C -30 -160, -70 -190, -95 -200 C -90 -165, -55 -135, -28 -125 Z" fill="#FAF8F5" />
  </g>
</svg>
