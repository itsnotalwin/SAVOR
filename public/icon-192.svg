<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A57" />
      <stop offset="100%" stop-color="#C85A36" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Subtle Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Flaming Skillet -->
    <!-- Handle -->
    <path d="M -130 50 L -70 20 L -55 35 L -115 65 Z" fill="#FAF8F5" />
    <!-- Pan Body -->
    <path d="M -80 0 C -80 75, 80 75, 80 0 C 80 -10, -80 -10, -80 0 Z" fill="#FAF8F5" />
    <!-- Pan Rim Inner Detail -->
    <ellipse cx="0" cy="0" rx="72" ry="18" fill="#E07A57" opacity="0.3" />

    <!-- Cooking Flame / Sizzle -->
    <path d="M -20 -30 C -35 -60, -10 -90, -5 -115 C 10 -95, 25 -110, 20 -80 C 35 -60, 10 -30, -20 -30 Z" fill="#FFF2DF" />
    <path d="M -8 -40 C -18 -60, -5 -75, -2 -90 C 8 -75, 15 -85, 12 -65 C 20 -50, 5 -35, -8 -40 Z" fill="#F4A261" />

    <!-- Crossed Chef Knives Accent Above -->
    <!-- Knife 1 -->
    <path d="M 10 -110 C 25 -145, 60 -170, 85 -180 C 80 -150, 50 -125, 25 -115 Z" fill="#FAF8F5" />
    <!-- Knife 2 -->
    <path d="M -10 -110 C -25 -145, -60 -170, -85 -180 C -80 -150, -50 -125, -25 -115 Z" fill="#FAF8F5" />
  </g>
</svg>
